<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Orbit -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Shield Hexagon -->
  <g filter="url(#glow)">
    <polygon points="256,110 380,182 380,330 256,402 132,330 132,182" fill="url(#accentGrad)" fill-opacity="0.12" stroke="url(#accentGrad)" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- Lightning / Fast Synapse Core -->
  <path d="M280 160 L195 280 L255 280 L232 352 L320 232 L260 232 Z" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

  <!-- 5 Nodes for the 5 Exercises -->
  <circle cx="256" cy="88" r="14" fill="#06b6d4" />
  <circle cx="424" cy="256" r="14" fill="#3b82f6" />
  <circle cx="360" cy="400" r="14" fill="#8b5cf6" />
  <circle cx="152" cy="400" r="14" fill="#ec4899" />
  <circle cx="88" cy="256" r="14" fill="#10b981" />
</svg>
